[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-decision-intelligence"
version = "2.0.0"
description = "Explainable procurement exception prioritization and capacity-aware decision support."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
